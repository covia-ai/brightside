# Test classes run concurrently in one JVM. Most share one embedded venue
# (SharedVenue), each under its own user principal; a venue serves many
# principals at once, so this is also how it is used for real. Methods within
# a class stay sequential unless the class opts in with
# @Execution(ExecutionMode.CONCURRENT).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
# No test waits on a clock, so a minute is a hang: fail it with a stack trace
# rather than stall the run.
junit.jupiter.execution.timeout.default=60 s
