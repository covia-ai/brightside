#
# Brightside's UI defaults — loaded by FlatLaf after any theme's own files
# (see brightside.ui.LAF, which registers this package as a custom defaults
# source), so everything here restyles whichever theme is chosen: FlatLaf's
# own, the IntelliJ pack's, or the owner's .theme.json. FlatLaf properties
# syntax: https://www.formdev.com/flatlaf/properties-files/
#
# [light] and [dark] prefix the values that differ between light and dark themes.
#


#---- accent ----
#
# @accentColor is not set here: brightside.ui.LAF supplies it (Brightside's own
# purple, or the one chosen in Settings → Theme) as a global extra default, and
# every accent-derived value below and in the theme — selection, focus, check
# marks, the default and primary buttons — follows it.


#---- semantic colours (read through brightside.ui.components.Theme) ----

Brightside.error = #E55353
Brightside.success = #3FB950
Brightside.warning = #E58A3A

# An elevated surface a step off the panel: assistant bubbles, cards, chips.
[dark]Brightside.surface = tint(@background,12%)
[light]Brightside.surface = shade(@background,6%)

# Derived accent shades for the primary button's hover and pressed states.
# From the resolved Component.accentColor, not the @accentColor variable: a
# theme in the IntelliJ format sets no variable, only its own resolved accent.
Brightside.primary.hoverBackground = lighten($Component.accentColor,6%)
Brightside.primary.pressedBackground = darken($Component.accentColor,6%)
Brightside.primary.foreground = #ffffff


#---- geometry: rounded, 2020s, comfortably spaced ----

Component.arc = 14
Button.arc = 18
TextComponent.arc = 14
CheckBox.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 1

# Slim, rounded, unobtrusive scrollbars.
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollPane.arc = 12

# Roomier menus and controls.
MenuItem.selectionArc = 8
Menu.selectionArc = 8
TitlePane.unifiedBackground = true
Button.default.boldText = true

# Navigation and list rows are tool-bar-style buttons (PressButton): the theme
# paints hover and pressed; the selected one — the active tab, the open agent or
# conversation — carries an accent tint.
Button.toolbar.selectedBackground = fade($Component.accentColor,22%)
ToggleButton.toolbar.selectedBackground = fade($Component.accentColor,22%)


#---- style classes (FlatLaf.styleClass; brightside.ui.components.Styles) ----
#
# Type-independent, so they apply to labels, text areas and buttons alike, and
# combine ("small muted"). FlatLaf's own small/mini/medium/large/h1–h4/semibold/
# monospaced classes are available too.

[style].muted = foreground: $Label.disabledForeground
[style].accent = foreground: $Component.accentColor
[style].error = foreground: $Brightside.error
[style].success = foreground: $Brightside.success
[style].warning = foreground: $Brightside.warning
# Relative sizes are scaled by FlatLaf's user scale factor (1.25 with the
# 15pt default font), so +7 reads as 24pt.
[style].strong = font: bold
[style].section = font: bold +2
[style].title = font: bold +7

# The one accent-filled call to action on a screen (Save, Continue, Send).
[style]Button.primary = \
	buttonType: roundRect; \
	background: $Component.accentColor; \
	foreground: $Brightside.primary.foreground; \
	hoverBackground: $Brightside.primary.hoverBackground; \
	pressedBackground: $Brightside.primary.pressedBackground; \
	borderColor: $Component.accentColor; \
	hoverBorderColor: $Brightside.primary.hoverBackground; \
	pressedBorderColor: $Brightside.primary.pressedBackground; \
	focusedBorderColor: $Component.accentColor; \
	font: bold

# A quiet secondary action (Back, Cancel, Copy): no chrome until hovered.
[style]Button.secondary = \
	buttonType: borderless; \
	foreground: $Label.disabledForeground

# A link-like action in the accent, opening something or moving on. Untyped:
# it dresses a PressButton (a toggle button), whose toolbar type already
# supplies the quiet, borderless look.
[style].link = foreground: $Component.accentColor
