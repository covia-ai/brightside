#
# Brightside's UI defaults — loaded by FlatLaf after any theme's own files
# (see brightside.ui.LAF, which registers this package as a custom defaults
# source), so everything here restyles whichever theme is chosen: FlatLaf's
# own, the IntelliJ pack's, or the owner's .theme.json. FlatLaf properties
# syntax: https://www.formdev.com/flatlaf/properties-files/
#
# [light] and [dark] prefix the values that differ between light and dark themes.
#


#---- accent ----
#
# @accentColor is not set here: brightside.ui.LAF supplies it (Brightside's own
# purple, or the one chosen in Settings → Theme) as a global extra default, and
# every accent-derived value below and in the theme — selection, focus, check
# marks, the default and primary buttons — follows it.


#---- Tau roles (read through brightside.ui.components.Theme) ----
#
# Every theme gets these keys. Tau Dark and Tau Light (TauDarkLaf.properties,
# TauLightLaf.properties) set them to the brand values and load after this
# file; on every other theme they fall back to values derived from the
# theme's own colours, so a theme pack keeps its look.

Brightside.blue = #4A90E2
Brightside.connection = #4A90E2
Brightside.yours = #F2AE30
Brightside.sidebar.background = $Panel.background
Brightside.sidebar.selectedBackground = $Brightside.surface
Brightside.sidebar.selectedBar = $Component.accentColor
Brightside.sidebar.selectedBar.width = 3
Brightside.chrome.background = $Panel.background
Brightside.warmSurface = $Brightside.surface
Brightside.card.background = $Brightside.surface
Brightside.card.arc = 24
Brightside.popover.background = $PopupMenu.background
Brightside.link = $Component.accentColor
Brightside.link.underline = $Brightside.blue
Brightside.localNode = $Component.accentColor
Brightside.countPill.background = $Component.accentColor
Brightside.countPill.foreground = #FFFFFF
Brightside.verified = $Brightside.blue
Brightside.public = $Brightside.blue
Brightside.private = $Label.foreground

# Status badges: icon plus label plus colour, never colour alone. Refused is
# calm, never red, and its label names the capability.
Brightside.status.running.background = fade($Brightside.blue,18%)
Brightside.status.running.foreground = $Label.foreground
Brightside.status.running.icon = $Brightside.blue
Brightside.status.signed.background = fade($Component.accentColor,16%)
Brightside.status.signed.foreground = $Label.foreground
Brightside.status.signed.icon = $Component.accentColor
Brightside.status.waiting.background = #F2AE30
Brightside.status.waiting.foreground = #1E2642
Brightside.status.waiting.icon = #1E2642
Brightside.status.refused.background = $Panel.background
Brightside.status.refused.foreground = $Label.foreground
Brightside.status.refused.icon = $Label.foreground
Brightside.status.refused.border = $Label.foreground

# Icon tile tints (IconTile): the concept's colour family.
Brightside.icon.violet = #8B5CF6
Brightside.icon.indigo = #4F5BC4
[light]Brightside.icon.navy = #2E3A66
[dark]Brightside.icon.navy = #8C99CE


#---- semantic colours (read through brightside.ui.components.Theme) ----

Brightside.error = #E55353
Brightside.success = #3FB950
Brightside.warning = #E58A3A

# Each tone's faint ground, behind a badge or a chip (brightside.ui.components.Tone):
# a touch stronger on dark themes, where a translucent tint reads fainter.
[dark]Brightside.accent.tint = fade($Component.accentColor,18%)
[light]Brightside.accent.tint = fade($Component.accentColor,14%)
[dark]Brightside.success.tint = fade($Brightside.success,18%)
[light]Brightside.success.tint = fade($Brightside.success,14%)
[dark]Brightside.warning.tint = fade($Brightside.warning,18%)
[light]Brightside.warning.tint = fade($Brightside.warning,14%)
[dark]Brightside.error.tint = fade($Brightside.error,18%)
[light]Brightside.error.tint = fade($Brightside.error,14%)
[dark]Brightside.muted.tint = fade($Label.disabledForeground,18%)
[light]Brightside.muted.tint = fade($Label.disabledForeground,14%)

# An elevated surface a step off the panel: assistant bubbles, cards, chips.
[dark]Brightside.surface = tint(@background,12%)
[light]Brightside.surface = shade(@background,6%)

# Behind code in rendered Markdown (inline and in blocks): a further step off
# the surface a bubble or card paints, so code reads as code without a frame.
[dark]Brightside.code.background = tint(@background,24%)
[light]Brightside.code.background = shade(@background,12%)

# The buttons' accent shades are derived in brightside.ui.LAF from the resolved
# Component.accentColor once the theme is installed, and put into the defaults:
# a properties file cannot compute a contrast. Brightside.accent.dark is the
# accent darkened until white reads on it (the user's bubbles' fill too);
# Brightside.accent.text is the accent as text on its faint tint — moved in
# lightness, lighter on a dark theme and darker on a light one, until it reads
# there. From them: Brightside.primary.background,
# .hoverBackground and .pressedBackground (the dark shade, a step either side)
# and Brightside.tinted.foreground, .background, .hoverBackground and
# .pressedBackground (the accent text on a faint accent tint).
Brightside.primary.foreground = #ffffff


#---- type ----
#
# Both faces are bundled (SIL Open Font License, the licence beside each in
# fonts/) and registered by brightside.ui.LAF, so they are identical on every
# platform: Inter for the UI (Regular, Medium, SemiBold, and Bold), set as the
# default font there at the 14 pt body size, and Inconsolata for the monospaced face — code in rendered Markdown,
# technical values, tool results. The first family in this list that is
# available is used, so the platform's own monospaced faces stand behind it
# rather than the JDK's logical Monospaced (Courier New on Windows).
monospaced.font = Inconsolata, Consolas, "Cascadia Mono", "SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", "Noto Sans Mono", Monospaced


#---- geometry: rounded, 2020s, comfortably spaced ----

# Radii from the design system (a FlatLaf arc is twice the CSS
# radius): buttons 8 px, inputs 10 px, checkboxes 6 px; cards 12 px is
# Brightside.card.arc above.
Component.arc = 20
Button.arc = 16
TextComponent.arc = 20
CheckBox.arc = 12
Component.focusWidth = 1
Component.innerFocusWidth = 1

# Slim, rounded, unobtrusive scrollbars.
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollPane.arc = 12

# Roomier menus and controls.
MenuItem.selectionArc = 8
Menu.selectionArc = 8
TitlePane.unifiedBackground = true
Button.default.boldText = true
# A little more room either side than FlatLaf's 14: bold text measured in whole
# pixels can paint a pixel wider at the screen's fractional metrics, and with no
# slack it would be cut short ("Cre…").
Button.margin = 2,16,2,16

# Tabs: the active tab carries a 2 px Cerulean underline.
TabbedPane.tabSelectionHeight = 2
TabbedPane.underlineColor = $Brightside.blue

# Navigation and list rows are tool-bar-style buttons (PressButton): the theme
# paints hover and pressed; the selected one — the active tab, the open agent or
# conversation — carries an accent tint.
Button.toolbar.selectedBackground = fade($Component.accentColor,22%)
ToggleButton.toolbar.selectedBackground = fade($Component.accentColor,22%)


#---- style classes (FlatLaf.styleClass; brightside.ui.components.Styles) ----
#
# Type-independent, so they apply to labels, text areas and buttons alike, and
# combine ("small muted"). FlatLaf's own small/mini/medium/large/h1–h4/semibold/
# monospaced classes are available too.

[style].muted = foreground: $Label.disabledForeground
[style].accent = foreground: $Brightside.accent.text
[style].error = foreground: $Brightside.error
[style].success = foreground: $Brightside.success
[style].warning = foreground: $Brightside.warning
# The type scale, relative to the 14 pt body: caption 12, small 13 (FlatLaf's
# small and mini are -1 and -2), lead 16, section 18, title 24, display 32.
# FlatLaf scales each with the UI.
[style].strong = font: bold
[style].caption = font: -2
[style].lead = font: semibold +2
[style].section = font: semibold +4
[style].title = font: bold +10
[style].display = font: bold +18
# A small capitalised label over a group (Labels.overline capitalises the text).
[style].overline = font: bold -2; foreground: $Label.disabledForeground

# Bottom navigation: compact labels, readable on the selected accent tint.
[style].navigation = font: -3; foreground: $Label.disabledForeground
[style].navigationActive = font: bold -3; foreground: $Brightside.accent.text

# The one call to action on a screen (Save, Continue, Send): white on the
# accent, darkened only as far as white needs to read on it at AA, so Tau's
# Royal Purple fills as it is (6.4:1) and any chosen accent still passes.
[style]Button.primary = \
	buttonType: roundRect; \
	background: $Brightside.primary.background; \
	foreground: $Brightside.primary.foreground; \
	hoverBackground: $Brightside.primary.hoverBackground; \
	pressedBackground: $Brightside.primary.pressedBackground; \
	borderColor: $Brightside.primary.background; \
	hoverBorderColor: $Brightside.primary.hoverBackground; \
	pressedBorderColor: $Brightside.primary.pressedBackground; \
	focusedBorderColor: $Component.accentColor; \
	font: bold

# The button that heads a list (+ Session, + Agent): the accent on
# its own faint tint — the navigation's selected look — so it reads as a way
# in, not as the screen's call to action. No border: the tint is the shape.
[style]Button.tinted = \
	buttonType: roundRect; \
	background: $Brightside.tinted.background; \
	foreground: $Brightside.tinted.foreground; \
	hoverBackground: $Brightside.tinted.hoverBackground; \
	pressedBackground: $Brightside.tinted.pressedBackground; \
	borderColor: fade($Component.accentColor,0%); \
	hoverBorderColor: fade($Component.accentColor,0%); \
	pressedBorderColor: fade($Component.accentColor,0%); \
	focusedBorderColor: $Component.accentColor; \
	font: bold

# The second choice beside a primary (Back, Cancel, Copy, Decline): no fill,
# a 2 px Cerulean outline and the ordinary text colour, so it reads as a
# button without competing with the one primary on the view.
[style]Button.secondary = \
	borderWidth: 2; \
	borderColor: $Brightside.blue; \
	hoverBorderColor: $Brightside.blue; \
	pressedBorderColor: $Brightside.blue; \
	focusedBorderColor: $Component.focusColor; \
	background: $Panel.background; \
	hoverBackground: $Brightside.warmSurface; \
	pressedBackground: $Brightside.warmSurface; \
	foreground: $Label.foreground; \
	focusWidth: 0; \
	innerFocusWidth: 1; \
	margin: 3,16,3,16

# A drop-down that stays in the background (what a list shows): small, muted,
# and flat on the panel until opened.
[style]ComboBox.quiet = \
	font: -2; \
	foreground: $Label.disabledForeground; \
	background: $Panel.background; \
	buttonBackground: $Panel.background; \
	borderColor: fade($Component.borderColor,0%)

# A link-like action in the accent, opening something or moving on. Untyped:
# it dresses a PressButton (a toggle button), whose toolbar type already
# supplies the quiet, borderless look.
[style].link = foreground: $Brightside.link

# Folder navigation uses the same quiet ground and accent tint as the other
# sidebar controls; all values follow the active theme.
[style]Tree.files = \
	background: $Panel.background; \
	selectionBackground: $Brightside.tinted.background; \
	selectionForeground: $Brightside.tinted.foreground; \
	selectionInactiveBackground: $Brightside.tinted.background; \
	selectionInactiveForeground: $Brightside.tinted.foreground; \
	selectionArc: 10; \
	selectionInsets: 0,4,0,4
