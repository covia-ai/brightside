#
# Tau Dark: the app's default theme. Loaded after FlatLaf's dark defaults and
# after brightside/ui/FlatLaf.properties, so these values win. Colour roles
# follow the dark pass: the navy field, a sunken sidebar, chrome one step up,
# raised cards, amber only for what is yours and what is waiting, Royal Purple
# as a fill (never as text on navy) and #B79BF0 for accent text.
#

#---- grounds ----
@background = #1E2642
@foreground = #F8F9FB
@disabledForeground = #A9AEC2
@selectionBackground = #3A3170
@selectionForeground = #F8F9FB
@selectionInactiveBackground = #2C3659

Panel.background = #1E2642
Label.disabledForeground = #A9AEC2
Brightside.surface = #273052
Brightside.code.background = #2C3659
Brightside.sidebar.background = #161C33
Brightside.sidebar.selectedBackground = #273052
Brightside.sidebar.selectedBar = #B79BF0
Brightside.chrome.background = #232B4A
Brightside.warmSurface = #232B4A
Brightside.card.background = #273052
Brightside.popover.background = #2C3659

TitlePane.background = #232B4A
TitlePane.inactiveBackground = #232B4A
ToolBar.background = #232B4A
PopupMenu.background = #2C3659
Popup.background = #2C3659
MenuBar.background = #232B4A
ToolTip.background = #2C3659
ToolTip.foreground = #F8F9FB
List.background = #273052
Table.background = #273052
Tree.background = #1E2642
TextField.background = #273052
TextArea.background = #273052
TextPane.background = #273052
EditorPane.background = #1E2642
PasswordField.background = #273052
FormattedTextField.background = #273052
ComboBox.background = #273052
ComboBox.buttonBackground = #273052
Spinner.background = #273052
List.hoverBackground = #232B4A
Table.selectionInactiveBackground = #232B4A

#---- rules and edges: white at 12% for dividers, a firmer edge on controls ----
Separator.foreground = #FFFFFF1F
Component.borderColor = #4A5375
Component.disabledBorderColor = #3A4366
Table.gridColor = #FFFFFF1F
ScrollBar.thumb = #FFFFFF2E
ScrollBar.hoverThumbColor = #FFFFFF47

#---- focus, outline, link, tabs ----
Component.focusColor = #7FB0EC
Component.focusedBorderColor = #7FB0EC
Brightside.link = #B79BF0
Brightside.link.underline = #7FB0EC
Component.linkColor = #B79BF0
TabbedPane.underlineColor = #7FB0EC
TabbedPane.inactiveUnderlineColor = #4A5375
TabbedPane.selectedForeground = #F8F9FB

#---- roles ----
Brightside.localNode = #F2AE30
Brightside.yours = #F2AE30
Brightside.countPill.background = #F2AE30
Brightside.countPill.foreground = #1E2642

#---- semantic ----
Brightside.success = #5FD07A
Brightside.warning = #F0A35E
Brightside.error = #FF7A7A
Brightside.verified = #7FB0EC
Brightside.public = #7FB0EC
Brightside.private = #F2AE30

#---- status badges ----
Brightside.status.running.background = #283D65
Brightside.status.running.foreground = #7FB0EC
Brightside.status.signed.background = #353068
Brightside.status.signed.foreground = #B79BF0
Brightside.status.waiting.background = #F2AE30
Brightside.status.waiting.foreground = #1E2642
Brightside.status.refused.background = #1E2642
Brightside.status.refused.foreground = #F8F9FB
Brightside.status.refused.border = #D4D7E3
Brightside.status.timedout.background = #2E3758
Brightside.status.timedout.foreground = #F8F9FB
Brightside.status.timedout.icon = #A9AFBC

#---- icon tile tints ----
Brightside.icon.violet = #B79BF0
Brightside.icon.indigo = #8891E8
Brightside.icon.navy = #8C99CE
Brightside.status.running.icon = #7FB0EC
Brightside.status.signed.icon = #B79BF0
Brightside.status.waiting.icon = #1E2642
Brightside.status.refused.icon = #F8F9FB
